name: novel-web

services:
  # ==========================================
  # Client: Frontend React (Vite) + Nginx
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-/}
        VITE_ADS_MODE: ${VITE_ADS_MODE:-placeholder}
    image: novel-web-client:production
    container_name: novel-web-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - novel_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Server: Backend API (Node.js Express + TS)
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: novel-web-server:production
    container_name: novel-web-server
    command: ["node", "dist/server.js"]
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-4000}:4000"
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Fallback to local mongo service if MONGODB_URI not set explicitly in .env
      MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGO_INITDB_ROOT_USERNAME:-novel_root}:${MONGO_INITDB_ROOT_PASSWORD:-novel_secure_password}@mongo:27017/${MONGO_INITDB_DATABASE:-webtruyen}?authSource=admin&replicaSet=rs0}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required for production}
      REDIS_TLS: ${REDIS_TLS:-false}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      JWT_REFRESH_PRIVATE_KEY: ${JWT_REFRESH_PRIVATE_KEY:?JWT_REFRESH_PRIVATE_KEY is required}
      JWT_REFRESH_PUBLIC_KEY: ${JWT_REFRESH_PUBLIC_KEY:?JWT_REFRESH_PUBLIC_KEY is required}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost}
      SEO_INDEXABLE: ${SEO_INDEXABLE:-false}
      SEO_SITEMAP_INTERVAL_MS: ${SEO_SITEMAP_INTERVAL_MS:-900000}
      SSR_SIGNING_SECRET: ${SSR_SIGNING_SECRET:-}
      CRAWLER_SOURCES_JSON: ${CRAWLER_SOURCES_JSON:-[]}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
    networks:
      - novel_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ==========================================
  # Redis: Cache & BullMQ Queue (v7 Alpine)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: novel-web-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT_HOST:-127.0.0.1:6379}:6379"
    networks:
      - novel_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ==========================================
  # MongoDB: Primary Database (v8.0 ReplicaSet)
  # ==========================================
  mongo:
    image: mongo:8.0
    container_name: novel-web-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-novel_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-novel_secure_password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-webtruyen}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    ports:
      - "${MONGO_PORT_HOST:-127.0.0.1:27017}:27017"
    networks:
      - novel_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # Mongo Init: Auto Initiate Replica Set rs0
  # ==========================================
  mongo-init:
    image: mongo:8.0
    container_name: novel-web-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - novel_network
    command: >
      mongosh --host mongo:27017 -u ${MONGO_INITDB_ROOT_USERNAME:-novel_root} -p ${MONGO_INITDB_ROOT_PASSWORD:-novel_secure_password} --authenticationDatabase admin --quiet --eval "
        try {
          const status = rs.status();
          if (status.ok === 1) {
            console.log('Replica set rs0 already initialized.');
          }
        } catch (e) {
          console.log('Initiating replica set rs0...');
          rs.initiate({
            _id: 'rs0',
            members: [{ _id: 0, host: 'mongo:27017' }]
          });
          console.log('Replica set rs0 initiated successfully.');
        }
      "

# ==========================================
# Networks & Persistent Volumes
# ==========================================
networks:
  novel_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  redis_data:
    driver: local
