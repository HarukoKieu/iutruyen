name: novel-web
services:
  secrets-init:
    build: { context: ./server }
    image: novel-web-backend
    user: "0:0"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    command: [node, docker/local-secrets.cjs]
    environment:
      NOVEL_LOCAL_DATABASE: ${NOVEL_LOCAL_DATABASE:-}
    volumes:
      - local_secrets:/run/novel-secrets
      - local_backups:/var/lib/novel-backups
      - local_redis:/var/lib/novel-redis
      - local_mongo:/mongo-data:ro
    restart: "no"
  mongo:
    image: mongo:8.0
    depends_on:
      secrets-init: { condition: service_completed_successfully }
    environment:
      MONGO_INITDB_ROOT_USERNAME: novel_local_root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/novel-secrets/root-password
      MONGO_INITDB_DATABASE: ${NOVEL_LOCAL_DATABASE:-}
      NOVEL_LOCAL_DATABASE: ${NOVEL_LOCAL_DATABASE:-}
    command: [mongod, --replSet, rs0, --bind_ip_all, --keyFile, /run/novel-secrets/keyfile, --wiredTigerCacheSizeGB, "0.25"]
    mem_limit: 1g
    volumes:
      - local_mongo:/data/db
      - local_mongo_config:/data/configdb
      - type: volume
        source: local_secrets
        target: /run/novel-secrets
        read_only: true
        volume: { subpath: mongo }
      - ./server/docker/mongo-users.js:/docker-entrypoint-initdb.d/01-users.js:ro
      - ./server/docker/mongo-health.js:/opt/novel/mongo-health.js:ro
    networks: [data]
    healthcheck:
      test: [CMD, mongosh, --nodb, --quiet, /opt/novel/mongo-health.js]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 20
    restart: unless-stopped
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo: { condition: service_healthy }
    command: [mongosh, --nodb, --quiet, /opt/novel/mongo-replica.js]
    volumes:
      - ./server/docker/mongo-replica.js:/opt/novel/mongo-replica.js:ro
      - type: volume
        source: local_secrets
        target: /run/novel-secrets
        read_only: true
        volume: { subpath: mongo }
    networks: [data]
    restart: "no"
  redis:
    image: redis:7-alpine
    user: "1000:1000"
    depends_on:
      secrets-init: { condition: service_completed_successfully }
    command: [redis-server, /run/novel-secrets/redis.conf]
    read_only: true
    mem_limit: 256m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - local_redis:/data
      - type: volume
        source: local_secrets
        target: /run/novel-secrets
        read_only: true
        volume: { subpath: redis }
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/novel-secrets/password)" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build: { context: ./server }
    image: novel-web-backend
    init: true
    user: "1000:1000"
    read_only: true
    mem_limit: 768m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: development
      NOVEL_LOCAL_DATABASE: ${NOVEL_LOCAL_DATABASE:-}
      PORT: 4000
      CLIENT_URL: http://localhost:5173
      PUBLIC_SITE_URL: http://localhost:5173
      COOKIE_DOMAIN: localhost
      SEO_INDEXABLE: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CRAWLER_SOURCES_JSON: ${CRAWLER_SOURCES_JSON:-[]}
      BACKUP_LOCAL_DIR: /var/lib/novel-backups
      BACKUP_KEY_FILE: /run/novel-secrets/backup-key
      BACKUP_MONGO_CONFIG_FILE: /run/novel-secrets/backup-mongo-config.json
    volumes:
      - local_backups:/var/lib/novel-backups
      - type: volume
        source: local_secrets
        target: /run/novel-secrets
        read_only: true
        volume: { subpath: backend }
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700"]
    networks: [data, api]
    ports: ["127.0.0.1:${NOVEL_LOCAL_API_PORT:-4000}:4000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped
  restore:
    image: novel-web-backend
    profiles: [tools]
    network_mode: service:mongo
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [node, docker/restore-entry.cjs]
    command: []
    environment:
      NOVEL_LOCAL_DATABASE: ${NOVEL_LOCAL_DATABASE:-}
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700"]
    volumes:
      - local_backups:/var/lib/novel-backups:ro
      - type: volume
        source: local_secrets
        target: /run/restore-secrets
        read_only: true
        volume: { subpath: restore }
    restart: "no"
volumes:
  local_mongo:
    name: ${NOVEL_DOCKER_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}}_local_mongo
    external: ${NOVEL_DOCKER_VOLUMES_EXTERNAL:-false}
  local_mongo_config:
    name: ${NOVEL_DOCKER_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}}_local_mongo_config
    external: ${NOVEL_DOCKER_VOLUMES_EXTERNAL:-false}
  local_redis:
    name: ${NOVEL_DOCKER_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}}_local_redis
    external: ${NOVEL_DOCKER_VOLUMES_EXTERNAL:-false}
  local_backups:
    name: ${NOVEL_DOCKER_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}}_local_backups
    external: ${NOVEL_DOCKER_VOLUMES_EXTERNAL:-false}
  local_secrets:
    name: ${NOVEL_DOCKER_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME}}_local_secrets
    external: ${NOVEL_DOCKER_VOLUMES_EXTERNAL:-false}
networks:
  data: { internal: true }
  api:
